name: pre-commit

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    strategy:
      fail-fast: false
      matrix:
        hook: [ check-toml,
                check-yaml,
                check-merge-conflict,
                check-case-conflict,
                detect-private-key,
                mixed-line-ending,
                trailing-whitespace,
                cspell,
                typos,
                cargo-fmt,
                cargo-clippy,
                cargo-test,
                verify_icon_files
              ]
    steps:
    - name: Get required packages and config git
      run: |
        pacman --noconfirm --noprogressbar -Syu base-devel clang cmake git libpipewire libpulse lm_sensors notmuch openssl pre-commit rsync
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - run: pre-commit run ${{ matrix.hook }} --all-files --show-diff-on-failure


