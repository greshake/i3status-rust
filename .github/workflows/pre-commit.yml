name: pre-commit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-20260920.0.596911@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    strategy:
      fail-fast: false
      matrix:
        hook: [ check-toml,
                check-yaml,
                check-merge-conflict,
                check-case-conflict,
                detect-private-key,
                mixed-line-ending,
                trailing-whitespace,
                cspell,
                typos,
                cargo-fmt,
                cargo-clippy,
                cargo-test,
                verify_icon_files
              ]
    steps:
    - name: Get required packages and config git
      run: |
        pacman --noconfirm --noprogressbar -Syu base-devel clang cmake git libpipewire libpulse lm_sensors notmuch openssl rsync
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: ${{ matrix.hook }} --all-files


